name: OctoC2 relay control ingress

on:
  repository_dispatch:
    types: [octoc2-relay-ingress]

concurrency:
  group: octoc2-relay-ingress-${{ github.event.client_payload.source_event_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and post the incoming comment exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_SIGNING_KEY: ${{ secrets.RELAY_SIGNING_KEY }}
          NODE_ROUTE_MAP: ${{ vars.NODE_ROUTE_MAP }}
          EVENT_JSON: ${{ toJSON(github.event.client_payload) }}
          CONTROL_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELAY_SIGNING_KEY}"
          test -n "${NODE_ROUTE_MAP}"

          SIGNATURE="$(jq -er '.signature' <<<"${EVENT_JSON}")"
          PAYLOAD="$(jq -cS 'del(.signature)' <<<"${EVENT_JSON}")"
          EXPECTED="$(printf '%s' "${PAYLOAD}" |
            openssl dgst -sha256 -hmac "${RELAY_SIGNING_KEY}" -hex |
            sed 's/^.* //')"
          test "${SIGNATURE}" = "${EXPECTED}"
          test "$(jq -er '.version' <<<"${PAYLOAD}")" = "1"
          test "$(jq -er '.direction' <<<"${PAYLOAD}")" = "ingress"

          ISSUED_AT="$(jq -er '.issued_at' <<<"${PAYLOAD}")"
          NOW="$(date -u +%s)"
          ISSUED="$(date -u -d "${ISSUED_AT}" +%s)"
          AGE="$((NOW - ISSUED))"
          test "${AGE}" -ge -300
          test "${AGE}" -le 900

          NODE_ID="$(jq -er '.node_id' <<<"${PAYLOAD}")"
          ROUTE="$(jq -cer --arg id "${NODE_ID}" '.[$id]' <<<"${NODE_ROUTE_MAP}")"
          CONTROL_ISSUE="$(jq -er '.controlIssue' <<<"${ROUTE}")"
          EXPECTED_DECOY_REPOSITORY="$(jq -er '.decoyRepository' <<<"${ROUTE}")"
          EXPECTED_DECOY_ISSUE="$(jq -er '.decoyIssue' <<<"${ROUTE}")"
          test "$(jq -er '.decoy_repository' <<<"${PAYLOAD}")" = "${EXPECTED_DECOY_REPOSITORY}"
          test "$(jq -er '.decoy_issue' <<<"${PAYLOAD}")" = "${EXPECTED_DECOY_ISSUE}"

          SOURCE_EVENT_ID="$(jq -er '.source_event_id' <<<"${PAYLOAD}")"
          MARKER="<!-- octoc2-relay:ingress:${SOURCE_EVENT_ID} -->"
          ALREADY_POSTED="$(gh api --paginate \
            "repos/${CONTROL_REPOSITORY}/issues/${CONTROL_ISSUE}/comments?per_page=100" |
            jq -s --arg marker "${MARKER}" 'flatten | any(.body | contains($marker))')"
          if [ "${ALREADY_POSTED}" = "true" ]; then
            echo "Relay event ${SOURCE_EVENT_ID} was already applied"
            exit 0
          fi

          COMMENT_BODY="$(jq -er '.comment_body' <<<"${PAYLOAD}")"
          printf '%s\n\n%s\n' "${COMMENT_BODY}" "${MARKER}" |
            gh issue comment "${CONTROL_ISSUE}" \
              --repo "${CONTROL_REPOSITORY}" \
              --body-file -
